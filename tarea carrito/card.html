<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El mejor spiderman</title>
        <link rel="stylesheet" href="estilo.css">
  </head>
    <body>
        <main class="container">
        <h1>El mejor spiderman de todos los tiempos, es...</h1>
        <div class="contador">
            Votos registrados:
            <span id="votos">0</span>
        </div>
        <p id="último voto"></p>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <img src="https://i.pinimg.com/1200x/30/ce/2c/30ce2ceba954b23ecea2390997e24fa8.jpg" alt="Tobey Maguire" class="spiderman">
                    <div class="card-body">
                        <h2>Tobey Maguire</h2>
                        <button class="votar" data-spiderman="Tobey Maguire">Votar</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="https://i.pinimg.com/1200x/65/c0/25/65c02591c413af714b522fc2e32f9c5a.jpg" alt="Andrew Garfield" class="spiderman">
                    <div class="card-body">
                        <h2>Andrew Garfield</h2>
                        <button class="votar" data-spiderman="Andrew Garfield">Votar</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <img src="https://i.pinimg.com/1200x/37/78/08/377808a7385580d9c32d3182e3321c6b.jpg" alt="Tom Holland" class="spiderman">
                    <div class="card-body">
                        <h2>Tom Holland</h2>
                        <button class="votar" data-spiderman="Tom Holland">Votar</button>
                    </div>
                </div>
            </div>
        </div>
        </main>
        <script src="carrito.js"></script>
    </body>
</html>
