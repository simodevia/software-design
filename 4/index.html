<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Carrito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>🛒 Mini Carrito</h1>

        <section>
            <h2>Productos</h2>
            <div id="productos"></div>
        </section>

        <section class="carrito">
            <h2>Carrito</h2>
            <div id="carrito">
                <p>El carrito está vacío</p>
            </div>

            <div class="resumen">
                <p>Productos: <strong id="cantidad">0</strong></p>
                <p>Total: <strong id="total">$0</strong></p>
                <button id="vaciar">Vaciar carrito</button>
            </div>
        </section>
    </main>

    <script src="vin.js"></script>
</body>
</html>
